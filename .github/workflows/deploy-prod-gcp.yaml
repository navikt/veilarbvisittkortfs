name: Deploy to prod
run-name: Deploy to prod ${{ github.ref_name }} by @${{ github.actor }}
on:
  workflow_dispatch:
  push:
    branches:
      - main
env:
  CI: true
  TZ: Europe/Amsterdam

jobs:
  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # ratchet:pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          pnpm_config__auth: '{"https://npm.pkg.github.com":{"@navikt":{"authToken":"${{ secrets.READER_TOKEN }}"}}}'

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Upload to CDN
        uses: nais/deploy/actions/cdn-upload/v2@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # ratchet:nais/deploy/actions/cdn-upload/v2@master
        with:
          team: poao
          source: ./build/
          destination: /veilarbvisittkortfs-prod/

      - name: Set special cache for asset-manifest.json
        shell: bash
        run: |
          gcloud storage objects update "gs://${BUCKET_NAME}/poao/veilarbvisittkortfs-prod/build/asset-manifest.json" --cache-control="public, max-age=120, stale-while-revalidate=1800, stale-if-error=600"
