name: Sjekk at koden bygger

on: pull_request

jobs:
  build-application:
    name: Build application and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # ratchet:pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          pnpm_config__auth: '{"https://npm.pkg.github.com":{"@navikt":{"authToken":"${{ secrets.READER_TOKEN }}"}}}'

      - name: Run tests
        run: pnpm run test

      - name: Build application
        run: pnpm run build:mock
