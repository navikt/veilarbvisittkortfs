name: Sjekk at koden bygger

on: pull_request

jobs:
  build-application:
    name: Build application and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # ratchet:pnpm/setup@v2.0.2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          pnpm_config__auth: '{"https://npm.pkg.github.com":{"@navikt":{"authToken":"${{ secrets.READER_TOKEN }}"}}}'

      - name: Run tests
        run: pnpm run test

      - name: Build application
        run: pnpm run build:mock
